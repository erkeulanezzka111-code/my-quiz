<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мақал-мәтелдер викторинасы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--tg-theme-bg-color, #0d1b2a);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .quiz-card {
      background-color: #1b263b;
      width: 100%;
      max-width: 480px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background-color: #0d1b2a;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d4af37, #f39c12);
      transition: width 0.3s ease;
    }
    .status {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 500;
      color: #e0e1dd;
    }
    .question-text {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
      margin-top: 8px;
      color: #ffffff;
    }
    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    .option-btn {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    /* 2 золотые кнопки */
    .option-gold {
      background-color: #d4af37;
      color: #0d1b2a;
    }
    /* 2 темно-синие кнопки */
    .option-blue {
      background-color: #0d1b2a;
      color: #ffffff;
      border: 1px solid #415a77;
    }
    .option-btn:active {
      transform: scale(0.98);
    }
    /* Правильный ответ — Зеленый */
    .option-btn.correct {
      background-color: #2ecc71 !important;
      color: #ffffff !important;
      border-color: #27ae60 !important;
    }
    /* Неправильный ответ — Красный */
    .option-btn.incorrect {
      background-color: #e74c3c !important;
      color: #ffffff !important;
      border-color: #c0392b !important;
    }
    .result-container {
      text-align: center;
      padding: 20px 0;
      display: none;
    }
    .result-score {
      font-size: 26px;
      font-weight: bold;
      margin: 16px 0;
      color: #f39c12;
    }
    .restart-btn {
      margin-top: 16px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #d4af37, #f39c12);
      color: #0d1b2a;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="quiz-card" id="quizCard">
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="status">
      <span id="questionCounter">Сұрақ 1 / 100</span>
      <span id="scoreCounter">Ұпай: 0</span>
    </div>

    <div class="question-text" id="questionText">Сұрақ жүктелуде...</div>

    <div class="options-container" id="optionsContainer"></div>

    <div class="result-container" id="resultContainer">
      <h2>Викторина аяқталды! 🎉</h2>
      <div class="result-score" id="finalScore"></div>
      <button class="restart-btn" onclick="restartQuiz()">Қайта бастау</button>
    </div>
  </div>

  <script src="quizData.js?v=2"></script>
  <script>
    let tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
    }

    let currentIndex = 0;
    let score = 0;
    let canAnswer = true;

    const questionTextEl = document.getElementById("questionText");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const questionCounterEl = document.getElementById("questionCounter");
    const scoreCounterEl = document.getElementById("scoreCounter");
    const progressBarEl = document.getElementById("progressBar");
    const resultContainerEl = document.getElementById("resultContainer");

    function loadQuestion() {
      if (typeof quizData === "undefined" || !quizData || quizData.length === 0) {
        questionTextEl.textContent = "Сұрақтар жүктелмеді. quizData.js файлын тексеріңіз.";
        return;
      }

      canAnswer = true;
      const currentQuiz = quizData[currentIndex];

      questionCounterEl.textContent = `Сұрақ ${currentIndex + 1} / ${quizData.length}`;
      scoreCounterEl.textContent = `Ұпай: ${score}`;
      progressBarEl.style.width = `${((currentIndex) / quizData.length) * 100}%`;

      questionTextEl.textContent = `${currentIndex + 1}. ${currentQuiz.question}`;
      optionsContainerEl.innerHTML = "";

      currentQuiz.options.forEach((option, idx) => {
        const btn = document.createElement("button");
        const colorClass = idx < 2 ? "option-gold" : "option-blue";
        btn.className = `option-btn ${colorClass}`;
        btn.textContent = option;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainerEl.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, btnElement) {
      if (!canAnswer) return;
      canAnswer = false;

      const currentQuiz = quizData[currentIndex];
      const buttons = optionsContainerEl.querySelectorAll(".option-btn");

      if (selectedIndex === currentQuiz.correct) {
        btnElement.classList.add("correct");
        score++;
        scoreCounterEl.textContent = `Ұпай: ${score}`;
      } else {
        btnElement.classList.add("incorrect");
        buttons[currentQuiz.correct].classList.add("correct");
      }

      setTimeout(() => {
        currentIndex++;
        if (currentIndex < quizData.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 1200);
    }

    function showResults() {
      questionTextEl.style.display = "none";
      optionsContainerEl.style.display = "none";
      progressBarEl.style.width = "100%";
      resultContainerEl.style.display = "block";
      document.getElementById("finalScore").textContent = `Нәтижеңіз: ${score} / ${quizData.length}`;
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      questionTextEl.style.display = "block";
      optionsContainerEl.style.display = "flex";
      resultContainerEl.style.display = "none";
      loadQuestion();
    }

    window.onload = loadQuestion;
  </script>
</body>
</html>
